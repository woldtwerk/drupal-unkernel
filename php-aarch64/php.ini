; php.ini for the static aarch64 PHP inside unkernel
memory_limit = 512M
max_execution_time = 0
date.timezone = UTC
realpath_cache_size = 16M
realpath_cache_ttl = 3600

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; files come over 9p from the host: revalidate rarely
opcache.revalidate_freq = 60
opcache.jit = off
; output_buffering: set with -d on the php -S command line (the CLI SAPI overrides php.ini)
