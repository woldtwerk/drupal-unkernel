# Static PHP for Drupal CMS (Drupal 11), cross-compiled for the unkernel guest (aarch64, musl, fully static)
php-version: 8.5
extensions: "bcmath,ctype,curl,dom,fileinfo,filter,gd,iconv,mbstring,opcache,openssl,pdo,pdo_sqlite,phar,posix,session,simplexml,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib"
packages: [libjpeg, libwebp, freetype]
sapi: cli
build-options:
  with-hardcoded-ini:
    - memory_limit=512M
download-options:
  parallel: 8
extra-env:
  SPC_TARGET: aarch64-linux-musl
